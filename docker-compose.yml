name: noria

services:
  qdrant:
    # Version compatible avec les anciens index RocksDB et le client Python 1.15.x.
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # L’image Qdrant ne fournit pas curl : vérifier /readyz avec Bash.
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ragnet

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434" # API REST Ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=2h
    # --- GPU NVIDIA (optionnel) ---
    # Décommente ce bloc si tu as une carte NVIDIA + nvidia-container-toolkit installé
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]
    # Sinon, tu peux rester en CPU: ça marchera, juste plus lent.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ragnet

networks:
  ragnet:

volumes:
  qdrant_storage:
  ollama_models:

