## `pyproject.toml`

[tool.poetry]
name = "noria"
version = "0.1.0"
description = "Noria — laboratoire de recherche documentaire local avec Ollama et Qdrant"
authors = ["assabu@gmail.com"]


[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras=["standard"]}
python-dotenv = "^1.0.1"
qdrant-client = "^1.9.0"
langchain-community = "^0.3.1"
langchain = "^0.3.1"
sentence-transformers = "^3.0.1"
transformers = "^4.44.0"
pandas = "^2.2.2"
pyarrow = "^17.0.0"
numpy = "^1.26.4"
httpx = "^0.27.0"
requests = "^2.32.3"
pydantic = "^2.8.2"
pypdf = ">=6,<7"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "^24.8.0"
ruff = "^0.6.9"
mypy = "^1.11.2"


[tool.black]
line-length = 100


[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B"]


[tool.pytest.ini_options]
addopts = "-q"


[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"